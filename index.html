<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Showcase</title>
</head>
<body>
    <header>
        <h1>Coastal Light</h1>
        <p>A small collection of photographs and one short film still waiting for its source file.</p>
        <img
            src="https://picsum.photos/id/1016/960/80"
            alt=""
            width="960"
            height="80"
        >
    </header>

    <main>
        <h2>Photographs</h2>

        <figure>
            <img
                src="https://picsum.photos/id/1015/640/427"
                alt="A river winding through a forested mountain valley under a cloudy sky"
                width="640"
                height="427"
            >
            <figcaption>Morning mist settling over a mountain river valley.</figcaption>
        </figure>

        <figure>
            <img
                src="https://picsum.photos/id/1018/640/427"
                alt="A wooden boardwalk crossing a wetland toward distant evergreen trees"
                width="640"
                height="427"
            >
            <figcaption>Boardwalk through a quiet wetland at midday.</figcaption>
        </figure>

        <figure>
            <img
                src="https://picsum.photos/id/1025/640/427"
                alt="A brown and white dog lying on a wooden dock with its eyes closed"
                width="640"
                height="427"
            >
            <figcaption>A dog resting on the dock after a swim.</figcaption>
        </figure>

        <img
            src="https://picsum.photos/id/1036/640/427"
            alt="A steam locomotive traveling along a track beside a body of water"
            width="640"
            height="427"
        >

        <img
            src="https://picsum.photos/id/1043/640/427"
            alt="Sunlit cliffs and ocean waves along a rugged coastline"
            width="640"
            height="427"
        >

        <img
            src="https://picsum.photos/id/1060/640/427"
            alt="A barista pouring steamed milk into a cup of espresso"
            width="640"
            height="427"
        >

        <h2>Film</h2>
        <p>Replace the empty video source with a local file when you are ready to play it.</p>
        <video
            controls
            poster="https://picsum.photos/id/1015/640/360"
            width="640"
            height="360"
        >
            <source src="./talking-to-ais.mp4" type="video/mp4">
            Your browser does not support the video element. Add a local video file to the source attribute to play it here.
        </video>
    </main>

    <footer>
        <p>Photo Showcase. Images from Picsum. Video source left empty for a local file.</p>
    </footer>
</body>
</html>
